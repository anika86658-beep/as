<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Fix for "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var globalObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : self);
          if (globalObj) {
            var currentFetch = globalObj.fetch;
            try {
              Object.defineProperty(globalObj, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              if (typeof Window !== 'undefined' && Window.prototype) {
                try {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return currentFetch;
                    },
                    set: function(newFetch) {
                      currentFetch = newFetch;
                    },
                    configurable: true,
                    enumerable: true
                  });
                } catch (e2) {}
              }
            }
          }
        } catch (e) {}

        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          }, true);
        }
      })();
    </script>
